name: 更新儀表板並發布 GitHub Pages

on:
  schedule:
    # GitHub 排程在尖峰時段常延遲或略過，排密一點（每 30 分鐘）確保實際約 1 小時內更新一次
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 離線測試
        run: python -m unittest discover tests
      - name: 抓取新聞 / 行情 / 總經指標並產生靜態網站
        run: python build_static.py --out site
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PREV_DATA_URL: https://peterpita-tech.github.io/news_screen/data.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
