name: 更新儀表板並發布 GitHub Pages

on:
  schedule:
    - cron: "17 */2 * * *"   # 每 2 小時更新一次（UTC）
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 離線測試
        run: python -m unittest discover tests
      - name: 抓取新聞 / 行情 / 總經指標並產生靜態網站
        run: python build_static.py --out site
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
